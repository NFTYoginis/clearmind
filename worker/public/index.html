<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClearMind — find what's really going on</title>
<meta name="description" content="A calmer way through. Talk through what's weighing on you and leave with one clear next step. No account, nothing saved." />
<meta name="robots" content="noindex" />
<style>
  :root{
    --warm-top:#efe9e0; --warm-bot:#f8f1e6; --ink:#2b3440; --muted:#6f6a61;
    --sage:#5f8a7d; --sage-deep:#4d7468; --you:#5c6168; --line:#e6e1d7;
    --paper:#fdfaf4; --paper-line:#ece4d6;
    --serif:"New York",ui-serif,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(120% 82% at 50% 118%, rgba(248,238,223,.9) 0%, rgba(248,238,223,0) 56%),
      linear-gradient(176deg,#efe9e0 0%,#f2ece2 44%,#f6efe4 73%,#f8f1e6 100%);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .vh{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;}
  :focus-visible{ outline:2px solid var(--sage); outline-offset:3px; border-radius:4px; }

  .app{max-width:660px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:0 32px;}

  header{text-align:center; padding:36px 0 34px;}
  .wordmark{font-size:18px; font-weight:600; letter-spacing:.2px; color:var(--ink);}
  .wordmark .dot{color:var(--sage);}
  .tagline{font-size:13px; color:var(--muted); margin-top:4px; letter-spacing:.2px;}

  /* the exchange — one reading column, no labels, no bubbles */
  .thread{flex:1; display:flex; flex-direction:column; gap:33px; padding-bottom:18px;}

  @keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }

  /* the companion writes — warm serif, hugs the LEFT */
  .cm{align-self:flex-start; max-width:80%;
    font-family:var(--serif); font-size:22px; line-height:1.62; color:var(--ink); letter-spacing:.1px;
    animation:rise .8s cubic-bezier(.22,.61,.36,1) both;}
  .cm p{white-space:pre-wrap; word-wrap:break-word;}
  .cm p+p{margin-top:.85em;}

  /* the person speaks — quiet sans, cascades to the RIGHT, sage edge (never a pill) */
  .you{align-self:flex-end; max-width:74%; text-align:right; padding-right:18px;
    border-right:2px solid var(--sage); font-size:16.5px; line-height:1.55; color:var(--you);
    white-space:pre-wrap; word-wrap:break-word;
    animation:rise .8s cubic-bezier(.22,.61,.36,1) both;}

  /* a single calm breath while the companion gathers a reply */
  .thinking{align-self:flex-start; display:flex; align-items:center; min-height:26px;
    animation:rise .8s cubic-bezier(.22,.61,.36,1) both;}
  .thinking .pulse{width:11px; height:11px; border-radius:50%; background:var(--sage);
    box-shadow:0 0 0 0 rgba(95,138,125,.18); animation:breathe 3.6s ease-in-out infinite;}
  @keyframes breathe{
    0%,100%{opacity:.34; transform:scale(.82); box-shadow:0 0 0 0 rgba(95,138,125,.16)}
    50%{opacity:.74; transform:scale(1.1); box-shadow:0 0 0 9px rgba(95,138,125,0)}
  }

  /* the crossing — arrives like a precious artifact */
  @keyframes arrive{ 0%{opacity:0; transform:translateY(18px) scale(.984)} 100%{opacity:1; transform:none} }
  .crossing-card{align-self:stretch; position:relative; background:var(--paper);
    border:1px solid var(--paper-line); border-radius:13px; padding:32px 30px 24px; margin:2px 0;
    box-shadow:0 12px 36px rgba(43,52,64,.12), inset 0 1px 0 rgba(255,255,255,.7);
    animation:arrive 1.15s cubic-bezier(.22,.61,.36,1) both;}
  .crossing-card::before{content:""; position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    width:22px; height:22px; border-radius:50%; background:var(--paper); border:1.5px solid var(--sage); box-shadow:0 0 0 5px var(--paper);}
  .crossing-card::after{content:""; position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:var(--sage);}
  .crossing-card .eyebrow{text-align:center; font-size:12px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--sage-deep); font-weight:600; padding-bottom:16px; border-bottom:1px solid var(--paper-line);}
  .crossing-card .sec-h{font-size:11.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--sage-deep); font-weight:700; margin:20px 0 5px;}
  .crossing-card .sec-h:first-of-type{margin-top:18px;}
  .crossing-card .sec-b{font-family:var(--serif); font-size:18px; line-height:1.58; color:var(--ink); white-space:pre-wrap; word-wrap:break-word;}
  .crossing-actions{display:flex; gap:10px; margin-top:24px; padding-top:18px; border-top:1px solid var(--paper-line); flex-wrap:wrap;}
  .crossing-actions button{font:14px/1 var(--sans); padding:9px 16px; border-radius:9px; cursor:pointer;
    border:1px solid var(--paper-line); background:#fff; color:var(--ink); transition:border-color .2s, color .2s;}
  .crossing-actions button:hover{border-color:var(--sage); color:var(--sage-deep);}

  /* composer — writing on warm paper, not an app field */
  .composer{position:sticky; bottom:0; padding:16px 0 10px;
    background:linear-gradient(180deg,rgba(248,241,230,0) 0%,var(--warm-bot) 40%);}
  .field{display:flex; align-items:center; gap:10px; background:rgba(255,253,249,.85);
    border:1px solid var(--line); border-radius:19px; padding:14px 14px 14px 21px;
    box-shadow:0 2px 16px rgba(43,52,64,.05); backdrop-filter:blur(5px); transition:border-color .2s, box-shadow .2s;}
  .field:focus-within{border-color:var(--sage); box-shadow:0 2px 18px rgba(95,138,125,.16);}
  .field textarea{flex:1; border:0; outline:0; resize:none; background:transparent;
    font:16.5px/1.5 var(--sans); color:var(--ink); max-height:168px; padding:0;}
  .field textarea::placeholder{color:#a39c8f;}
  .send{width:38px; height:38px; border:0; border-radius:50%; background:var(--sage); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; cursor:pointer; flex:0 0 auto;
    box-shadow:0 2px 8px rgba(95,138,125,.32); transition:background .2s;}
  .send:hover{background:var(--sage-deep);}
  .send:disabled{opacity:.42; cursor:default;}

  .safety{text-align:center; font-size:12.5px; color:var(--muted); padding:13px 0 28px;}
  .safety a{color:var(--sage-deep); text-decoration:none; border-bottom:1px solid rgba(95,138,125,.3);}
  .safety a:hover{color:var(--sage);}

  @media (prefers-reduced-motion: reduce){
    .cm, .you, .thinking, .crossing-card{ animation:none; }
    .thinking .pulse{ animation:none; opacity:.58; }
  }

  @media print{
    body *{visibility:hidden;}
    .crossing-card, .crossing-card *{visibility:visible;}
    .crossing-card::before, .crossing-card::after, .crossing-actions{display:none;}
    .crossing-card{position:absolute; left:0; top:0; width:100%; border:0; box-shadow:none; animation:none;}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500&display=swap" rel="stylesheet">
<style id="qs-bar">
  :root{--qs-ink:#1A2738;--qs-amber:#B5731A;--qs-cream:#FEFAF3;--qs-gold:#C8A96E;--qs-display:"Fraunces",Georgia,serif;--qs-body:"Inter",system-ui,sans-serif}
  .qs-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 16px;background:var(--qs-cream);color:var(--qs-ink);font:500 13px/1.4 var(--qs-body);border-bottom:1px solid var(--qs-gold);text-align:left}
  .qs-bar img{border-radius:50%;background:var(--qs-cream)}
  .qs-bar a{color:var(--qs-amber);text-decoration:none}.qs-bar a:hover{text-decoration:underline}
  .qs-bar .qs-by a{font-family:var(--qs-display);font-weight:600;color:var(--qs-ink)}
  .qs-bar .qs-sep{color:var(--qs-gold)}.qs-bar .qs-icm{margin-left:auto;color:#4a5566}
  @media(max-width:560px){.qs-bar .qs-icm{margin-left:0;flex-basis:100%}}
  body{display:flex;flex-direction:column}
  body>.app{flex:1 0 auto;min-height:0;width:100%}
</style>
</head>

<div class="app">
  <header>
    <div class="wordmark">ClearMind<span class="dot">.</span></div>
    <div class="tagline">Find what's really going on.</div>
  </header>

  <main class="thread" id="stream" role="log" aria-live="polite" aria-label="Conversation"></main>

  <div class="composer">
    <div class="field">
      <textarea id="input" rows="1" placeholder="What's weighing on you?" aria-label="What's weighing on you?"></textarea>
      <button class="send" id="send" aria-label="Send">↑</button>
    </div>
  </div>
  <div class="safety">
    Heavier than something to think through? Free, confidential help, any time —
    <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a>
  </div>
</div>

<script>
(() => {
  const stream = document.getElementById('stream');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  // The browser holds the transcript. Nothing is stored server-side.
  const messages = [];
  let busy = false;

  const WELCOME =
    "Hi — I'm here to help you find what's really going on with something that's weighing on you, " +
    "and to leave with one clear next step. No account, nothing saved. Take your time.\n\nWhat's on your mind?";

  function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
  function vhLabel(text){ return el('span','vh', text); }
  function scroll(){ stream.scrollTop = stream.scrollHeight; window.scrollTo(0, document.body.scrollHeight); }

  // render companion text as paragraphs (blank line = new paragraph) — the letter rhythm
  function setBody(container, text){
    container.textContent = '';
    const t = text || '';
    for(const para of t.split(/\n{2,}/)){
      if(para.trim() === '') continue;
      container.appendChild(el('p', null, para));
    }
  }

  function addUser(text){
    const m = el('div','you');
    m.appendChild(vhLabel('You said: '));
    m.appendChild(document.createTextNode(text));
    stream.appendChild(m); scroll();
  }
  function addCM(text){
    const m = el('div','cm');
    m.appendChild(vhLabel('ClearMind: '));
    const body = el('div','cm-body'); m.appendChild(body);
    setBody(body, text||'');
    stream.appendChild(m); scroll();
    return body;
  }
  function addThinking(){
    const m = el('div','thinking');
    m.appendChild(vhLabel('ClearMind is thinking'));
    m.appendChild(el('span','pulse'));
    stream.appendChild(m); scroll();
    return m;
  }

  // strip the crossing fence (and anything after) from the live-streaming view
  function visiblePart(text){
    const i = text.indexOf('```crossing');
    return i === -1 ? text : text.slice(0, i).trimEnd();
  }

  function renderCrossingCard(doc){
    const card = el('div','crossing-card');
    card.appendChild(el('div','eyebrow','Your crossing — yours to keep'));
    const HEADERS = ['WHAT I NOW UNDERSTAND','MY NEXT STEP','WHAT MIGHT STOP ME','HOW I WILL RESPOND'];
    let buf = [];
    const flush = () => { if(buf.length){ card.appendChild(Object.assign(el('div','sec-b'), {textContent: buf.join('\n')})); buf=[]; } };
    for(const line of doc.split('\n')){
      if(HEADERS.includes(line.trim())){ flush(); card.appendChild(el('div','sec-h', line.trim())); }
      else buf.push(line);
    }
    flush();
    const actions = el('div','crossing-actions');
    const bSave = el('button',null,'Save'); bSave.onclick = () => {
      const blob = new Blob([doc+'\n'], {type:'text/plain'});
      const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'my-crossing.txt'; a.click(); URL.revokeObjectURL(a.href);
    };
    const bPrint = el('button',null,'Print'); bPrint.onclick = () => window.print();
    const bCopy = el('button',null,'Copy'); bCopy.onclick = async () => { try{ await navigator.clipboard.writeText(doc); bCopy.textContent='Copied'; setTimeout(()=>bCopy.textContent='Copy',1400);}catch(_){} };
    actions.appendChild(bSave); actions.appendChild(bPrint); actions.appendChild(bCopy);
    card.appendChild(actions);
    stream.appendChild(card); scroll();
  }

  async function turn(){
    if(busy) return;
    const text = input.value.trim();
    if(!text) return;
    busy = true; send.disabled = true; input.value=''; input.style.height='auto';
    addUser(text);
    messages.push({role:'user', content:text});

    const thinkEl = addThinking();
    let body = null, full = '';

    try{
      const res = await fetch('/api/chat', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ messages })
      });
      const ctype = res.headers.get('content-type') || '';
      if(!ctype.includes('text/event-stream')){
        const data = await res.json().catch(()=>({message:"Something went wrong. Try again in a moment."}));
        thinkEl.remove(); addCM(data.message || "Something went wrong. Try again in a moment.");
        busy=false; send.disabled=false; return;
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder(); let buf='';
      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split('\n'); buf = lines.pop();
        for(const line of lines){
          if(!line.startsWith('data:')) continue;
          const p = line.slice(5).trim();
          if(!p || p==='[DONE]') continue;
          let evt; try{ evt=JSON.parse(p); }catch{ continue; }
          if(evt.type==='content_block_delta' && evt.delta?.type==='text_delta'){
            if(!body){ thinkEl.remove(); body = addCM(''); }
            full += evt.delta.text;
            setBody(body, visiblePart(full));
            scroll();
          }
        }
      }
    }catch(_){
      thinkEl.remove(); addCM("I lost the thread for a second there — try once more.");
      busy=false; send.disabled=false; return;
    }

    if(!body){ thinkEl.remove(); body = addCM(visiblePart(full) || "…"); }

    // finalize: lift out the crossing block, render the card, keep any warm close
    const m = full.match(/```crossing\s*\n([\s\S]*?)```/);
    if(m){
      setBody(body, full.slice(0, m.index).trimEnd());
      renderCrossingCard(m[1].trim());
      const after = full.slice(m.index + m[0].length).trim();
      if(after) addCM(after);
    } else {
      setBody(body, full);
    }
    messages.push({role:'assistant', content:full});
    busy=false; send.disabled=false; input.focus(); scroll();
  }

  // input behavior
  input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,168)+'px'; });
  input.addEventListener('keydown', (e) => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); turn(); } });
  send.addEventListener('click', turn);

  // open with ClearMind's welcome (no API call)
  addCM(WELCOME);
  input.focus();
})();
</script>
</body>
</html>
